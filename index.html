<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOOD GOODS — Official Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #000000;
      padding: 40px 5vw;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================
       1. DAMSO.COM 스타일 상단 헤더
    ========================================= */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 60px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -1px;
      text-decoration: none;
      color: #000;
    }

    .header-nav {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    .nav-link {
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .cart-btn {
      font-weight: 600;
    }

    /* =========================================
       2. 미니멀 상품 그리드 (DAMSO.COM 스타일)
    ========================================= */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 50px 30px;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .product-image-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #ffffff;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .product-image-container img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .product-card:hover .product-image-container img {
      transform: scale(1.08);
    }

    .product-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 0.85rem;
    }

    .product-title {
      font-weight: 500;
      color: #000000;
    }

    .product-price {
      font-weight: 400;
      color: #555555;
    }

    /* =========================================
       3. 슬라이드 우측 장바구니 드로어 (Side Panel)
    ========================================= */
    .cart-drawer-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 1000;
    }

    .cart-drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .cart-drawer {
      position: fixed;
      top: 0; right: -420px;
      width: 100%;
      max-width: 400px;
      height: 100%;
      background-color: #ffffff;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: -10px 0 30px rgba(0,0,0,0.05);
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1001;
    }

    .cart-drawer-overlay.active .cart-drawer {
      right: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 20px;
    }

    .drawer-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .close-drawer {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .cart-items-list {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }

    .cart-item-details {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .cart-item-img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .checkout-btn {
      width: 100%;
      background-color: #000000;
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .checkout-btn:hover {
      background-color: #333333;
    }

    /* 반응형 구조 */
    @media (max-width: 1024px) {
      .shop-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }
      .shop-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 30px 15px;
      }
    }
  </style>
</head>
<body>

  <!-- DAMSO 스타일 헤더 -->
  <header>
    <a href="#" class="logo">GOOD GOODS</a>
    <nav class="header-nav">
      <a href="#" class="nav-link">INFO</a>
      <a class="nav-link cart-btn" onclick="toggleCart()">CART (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <!-- 미니멀 상품 그리드 -->
  <main class="shop-grid" id="product-grid"></main>

  <!-- 우측 장바구니 슬라이드 드로어 -->
  <div class="cart-drawer-overlay" id="cart-overlay" onclick="closeCartOnBg(event)">
    <div class="cart-drawer">
      <div>
        <div class="drawer-header">
          <span class="drawer-title">YOUR CART</span>
          <button class="close-drawer" onclick="toggleCart()">✕</button>
        </div>
        <div class="cart-items-list" id="cart-items">
          <p style="font-size: 0.85rem; color: #888; text-align: center; margin-top: 40px;">Your cart is empty.</p>
        </div>
      </div>
      <div>
        <button class="checkout-btn">CHECKOUT</button>
      </div>
    </div>
  </div>

  <script>
    /* ========================================================
       [GOOD GOODS 상품 목록]
    ======================================================== */
    const PRODUCTS = [
      { id: 1, title: 'Vintage Alarm Clock', price: '₩28,000', imgSrc: './images/1.png' },
      { id: 2, title: 'Fozzie Bear Figurine', price: '₩35,000', imgSrc: './images/2.png' },
      { id: 3, title: 'Monster Toy', price: '₩32,000', imgSrc: './images/3.png' },
      { id: 4, title: 'Skinny Alien', price: '₩29,000', imgSrc: './images/4.png' },
      { id: 5, title: 'Bad Boy Figure', price: '₩39,000', imgSrc: './images/5.png' }
    ];

    let cart = [];
    const gridContainer = document.getElementById('product-grid');

    // 상품 카드 생성
    PRODUCTS.forEach(product => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.onclick = () => addToCart(product);

      card.innerHTML = `
        <div class="product-image-container">
          <img src="${product.imgSrc}" alt="${product.title}" />
        </div>
        <div class="product-info">
          <span class="product-title">${product.title}</span>
          <span class="product-price">${product.price}</span>
        </div>
      `;

      gridContainer.appendChild(card);
    });

    // 장바구니 기능
    function addToCart(product) {
      cart.push(product);
      updateCart();
      toggleCart(true);
    }

    function updateCart() {
      document.getElementById('cart-count').innerText = cart.length;
      const cartItemsContainer = document.getElementById('cart-items');

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = `<p style="font-size: 0.85rem; color: #888; text-align: center; margin-top: 40px;">Your cart is empty.</p>`;
        return;
      }

      cartItemsContainer.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-details">
            <img class="cart-item-img" src="${item.imgSrc}" alt="${item.title}">
            <div>
              <div style="font-weight: 500;">${item.title}</div>
              <div style="color: #666; font-size: 0.75rem;">${item.price}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleCart(forceOpen = false) {
      const overlay = document.getElementById('cart-overlay');
      if (forceOpen) {
        overlay.classList.add('active');
      } else {
        overlay.classList.toggle('active');
      }
    }

    function closeCartOnBg(e) {
      if (e.target.id === 'cart-overlay') {
        toggleCart();
      }
    }
  </script>
</body>
</html>
