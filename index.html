<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOOD GOODS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #111111;
      padding: 30px 40px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* =========================================
       1. 상단 헤더 & 네비게이션
    ========================================= */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      animation: fadeInHeader 0.8s ease-out forwards;
    }

    @keyframes fadeInHeader {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand-logo {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      text-decoration: none;
      color: #000;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .top-nav a {
      text-decoration: none;
      color: #333;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .top-nav a:hover {
      color: #888;
    }

    .search-bar {
      border: none;
      border-bottom: 1px solid #ccc;
      padding: 2px 4px;
      font-size: 0.75rem;
      outline: none;
      width: 120px;
    }

    /* =========================================
       2. 카테고리 필터 라디오 버튼 영역
    ========================================= */
    .filter-container {
      margin-bottom: 40px;
      font-size: 0.75rem;
      color: #555;
      line-height: 1.8;
      animation: fadeInHeader 0.8s ease-out 0.2s forwards;
      opacity: 0;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .filter-item input[type="radio"] {
      appearance: none;
      width: 10px;
      height: 10px;
      border: 1px solid #777;
      border-radius: 50%;
      outline: none;
      cursor: pointer;
      position: relative;
    }

    .filter-item input[type="radio"]:checked::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 4px;
      height: 4px;
      background-color: #000;
      border-radius: 50%;
    }

    /* =========================================
       3. 미니멀 아카이브 그리드 (7열 구조)
    ========================================= */
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 35px 25px;
      align-items: center;
      justify-items: center;
      perspective: 1000px; /* 입체 회오리 효과용 */
    }

    /* 회오리 모션 애니메이션 (Spiral Swirl & Scatter) */
    @keyframes vortexSettle {
      0% {
        opacity: 0;
        transform: translate(var(--twist-x), var(--twist-y)) scale(0) rotate(540deg);
      }
      60% {
        opacity: 0.8;
        transform: translate(calc(var(--twist-x) * 0.2), calc(var(--twist-y) * 0.2)) scale(1.15) rotate(-30deg);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
    }

    .grid-item {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;

      /* 초기 상태 및 애니메이션 적용 */
      opacity: 0;
      animation: vortexSettle 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    .grid-item img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s ease;
    }

    .grid-item:hover img {
      transform: scale(1.15) translateY(-4px);
      filter: drop-shadow(0px 8px 15px rgba(0, 0, 0, 0.15));
    }

    /* =========================================
       4. 미니멀 모달 팝업
    ========================================= */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.92);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      text-align: center;
      max-width: 400px;
      padding: 20px;
      transform: scale(0.9);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-content img {
      max-width: 240px;
      max-height: 240px;
      object-fit: contain;
      margin-bottom: 20px;
      filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.12));
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 20px;
    }

    .close-btn {
      background: none;
      border: 1px solid #111;
      padding: 6px 20px;
      font-size: 0.75rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.2s, color 0.2s;
    }

    .close-btn:hover {
      background: #111;
      color: #fff;
    }

    /* 반응형 레이아웃 */
    @media (max-width: 1024px) {
      .archive-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
      .archive-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px 15px;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <header>
    <a href="#" class="brand-logo">GOOD GOODS</a>
    <nav class="top-nav">
      <a href="#">ABOUT</a>
      <a href="#">STOCKIST</a>
      <a href="#">WEBSHOP</a>
      <a href="#">INSTAGRAM</a>
      <a href="#">CONTACT</a>
      <input type="text" class="search-bar" placeholder="Search...">
    </nav>
  </header>

  <!-- 라디오 필터 영역 -->
  <div class="filter-container">
    <div class="filter-row" style="margin-bottom: 6px;">
      <label class="filter-item"><input type="radio" name="main-filter" checked> all</label>
      <label class="filter-item"><input type="radio" name="main-filter"> original</label>
      <label class="filter-item"><input type="radio" name="main-filter"> client</label>
    </div>
    <div class="filter-row">
      <label class="filter-item"><input type="radio" name="sub-filter"> graphic</label>
      <label class="filter-item"><input type="radio" name="sub-filter"> logo</label>
      <label class="filter-item"><input type="radio" name="sub-filter"> fashion</label>
      <label class="filter-item"><input type="radio" name="sub-filter"> product</label>
      <label class="filter-item"><input type="radio" name="sub-filter"> object</label>
      <label class="filter-item"><input type="radio" name="sub-filter"> book</label>
      <label class="filter-item"><input type="radio" name="sub-filter"> photo</label>
      <label class="filter-item"><input type="radio" name="sub-filter"> illustration</label>
    </div>
  </div>

  <!-- 그리드 아카이브 영역 -->
  <main class="archive-grid" id="grid-container"></main>

  <!-- 상세 보기 모달 -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <img id="modal-img" src="" alt="Product Detail">
      <h3 class="modal-title" id="modal-title">Item Title</h3>
      <p class="modal-desc" id="modal-desc">Item Description</p>
      <button class="close-btn" onclick="closeModal()">CLOSE</button>
    </div>
  </div>

  <script>
    /* ========================================================
       [상품/오브젝트 목록]
    ======================================================== */
    const ITEMS = [
      { id: 1, name: 'Vintage Alarm Clock', imgSrc: './images/1.png', desc: 'Object / Vintage Toy' },
      { id: 2, name: 'Fozzie Bear', imgSrc: './images/2.png', desc: 'Object / Plush Figure' },
      { id: 3, name: 'Monster Toy', imgSrc: './images/3.png', desc: 'Object / Character' },
      { id: 4, name: 'Skinny Alien', imgSrc: './images/4.png', desc: 'Object / Figure' },
      { id: 5, name: 'Bad Boy Figure', imgSrc: './images/5.png', desc: 'Object / Street Figure' }
    ];

    const container = document.getElementById('grid-container');

    // 회오리 위치 계산 및 소용돌이 진입 연출
    ITEMS.forEach((item, index) => {
      const el = document.createElement('div');
      el.className = 'grid-item';

      // 각 아이템마다 중앙 회오리에서의 무작위 출발 좌표 계산 (각도 & 거리를 회오리처럼 오프셋)
      const angle = (index / ITEMS.length) * Math.PI * 4;
      const radius = 180 + (index % 3) * 60;
      const offsetX = Math.cos(angle) * radius;
      const offsetY = Math.sin(angle) * radius;

      // CSS 변수로 시작 회오리 좌표 전달
      el.style.setProperty('--twist-x', `${offsetX}px`);
      el.style.setProperty('--twist-y', `${offsetY}px`);

      // 0.08초 간격으로 연속 회오리 출격
      el.style.animationDelay = `${0.2 + index * 0.08}s`;

      el.onclick = () => openModal(item.name, item.imgSrc, item.desc);
      el.innerHTML = `<img src="${item.imgSrc}" alt="${item.name}" />`;
      container.appendChild(el);
    });

    // 모달 컨트롤
    const modal = document.getElementById('modal');

    function openModal(title, imgSrc, desc) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('modal-desc').innerText = desc;
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    // 모달 배경 클릭 시 닫기
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
  </script>
</body>
</html>
