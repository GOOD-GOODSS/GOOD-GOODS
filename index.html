<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOOD GOODS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #111111;
      padding: 30px 40px;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================
       1. 상단 헤더 & 네비게이션
    ========================================= */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .brand-logo {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      text-decoration: none;
      color: #000;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .top-nav a {
      text-decoration: none;
      color: #333;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .top-nav a:hover {
      color: #888;
    }

    .search-bar {
      border: none;
      border-bottom: 1px solid #ccc;
      padding: 2px 4px;
      font-size: 0.75rem;
      outline: none;
      width: 120px;
    }

    /* =========================================
       2. 카테고리 필터 라디오 버튼 영역
    ========================================= */
    .filter-container {
      margin-bottom: 40px;
      font-size: 0.75rem;
      color: #555;
      line-height: 1.8;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .filter-item input[type="radio"] {
      appearance: none;
      width: 10px;
      height: 10px;
      border: 1px solid #777;
      border-radius: 50%;
      outline: none;
      cursor: pointer;
      position: relative;
    }

    .filter-item input[type="radio"]:checked::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 4px;
      height: 4px;
      background-color: #000;
      border-radius: 50%;
    }

    /* =========================================
       3. 미니멀 아카이브 그리드 (7열 구조)
    ========================================= */
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 35px 25px;
      align-items: center;
      justify-items: center;
    }

    .grid-item {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    .grid-item img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      transition: transform 0.25s ease-out;
    }

    .grid-item:hover img {
      transform: scale(1.08);
    }

    /* =========================================
       4. 미니멀 모달 팝업
    ========================================= */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.92);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      text-align: center;
      max-width: 400px;
      padding: 20px;
    }

    .modal-content img {
      max-width: 240px;
      max-height: 240px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 20px;
    }

    .close-btn {
      background: none;
      border: 1px solid #111;
      padding: 6px 20px;
      font-size: 0.75rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.2s, color 0.2s;
    }

    .close-btn:hover {
      background: #111;
      color: #fff;
    }

    /* 반응형 레이아웃 */
    @media (max-width: 1024px) {
      .archive-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
      .archive-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px 15px;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <header>
    <a href="#" class="brand-logo">GOOD GOODS</a>
    <nav class="top-nav">
      <a href="#">ABOUT</a>
      <a href="#">STOCKIST</a>
      <a href="#">WEBSHOP</a>
      <a href="#">INSTAGRAM</a>
      <a href="#">CONTACT</a>
      <input type="text" class="search-bar" placeholder="Search...">
    </nav>
  </header>

  <!-- 라디오 필터 영역 -->
  <div class="filter-container">
    <div class="filter-row" style="margin-bottom: 6px;">
      <label class="filter-item"><input type="radio" name="main-filter" checked> all</label>
      <label class="filter-item"><input type="radio" name="main-filter"> original</label>
      <label class="filter-item"><input type="radio" name="main-filter"> client</label>
    </div>
    <div class="filter-row">
      <label class="filter-item"><input type="radio" name="sub-filter"> graphic</label>
      <label class="filter-item"><input type="radio" name="sub-filter"> logo</label>
      <label class="filter-item"><input type="radio" name="sub-filter"> fashion</label>
      <label class="filter-item"><input type="radio" name="sub-filter"> product</label>
      <label class="filter-item"><input type="radio" name="sub-filter"> object</label>
      <label class="filter-item"><input type="radio" name="sub-filter"> book</label>
      <label class="filter-item"><input type="radio" name="sub-filter"> photo</label>
      <label class="filter-item"><input type="radio" name="sub-filter"> illustration</label>
    </div>
  </div>

  <!-- 그리드 아카이브 영역 -->
  <main class="archive-grid" id="grid-container"></main>

  <!-- 상세 보기 모달 -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <img id="modal-img" src="" alt="Product Detail">
      <h3 class="modal-title" id="modal-title">Item Title</h3>
      <p class="modal-desc" id="modal-desc">Item Description</p>
      <button class="close-btn" onclick="closeModal()">CLOSE</button>
    </div>
  </div>

  <script>
    /* ========================================================
       [상품/오브젝트 목록 추가/수정하는 곳]
       - name: 작품/상품 이름
       - imgSrc: images/1.png 등 이미지 경로
       - desc: 간단 설명
    ======================================================== */
    const ITEMS = [
      { id: 1, name: 'Vintage Alarm Clock', imgSrc: './images/1.png', desc: 'Object / Vintage Toy' },
      { id: 2, name: 'Fozzie Bear', imgSrc: './images/2.png', desc: 'Object / Plush Figure' },
      { id: 3, name: 'Monster Toy', imgSrc: './images/3.png', desc: 'Object / Character' },
      { id: 4, name: 'Skinny Alien', imgSrc: './images/4.png', desc: 'Object / Figure' },
      { id: 5, name: 'Bad Boy Figure', imgSrc: './images/5.png', desc: 'Object / Street Figure' }
    ];

    const container = document.getElementById('grid-container');

    // 그리드 아이템 생성
    ITEMS.forEach(item => {
      const el = document.createElement('div');
      el.className = 'grid-item';
      el.onclick = () => openModal(item.name, item.imgSrc, item.desc);

      el.innerHTML = `<img src="${item.imgSrc}" alt="${item.name}" />`;
      container.appendChild(el);
    });

    // 모달 컨트롤
    function openModal(title, imgSrc, desc) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
