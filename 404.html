<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — GOOD GOODS</title>
  <!-- 404 페이지는 /없는/깊은/주소 에서도 열릴 수 있어서, 외부 CSS 없이 이 파일 안에 스타일을 넣었어요. -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #000; background: #fff; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 20px; -webkit-font-smoothing: antialiased;
    }
    h1 { font-size: 4rem; font-weight: 700; letter-spacing: -2px; }
    p { margin: 14px 0 28px; color: #555; font-size: 0.9rem; }
    a {
      background: #000; color: #fff; text-decoration: none; padding: 16px 36px;
      font-size: 0.85rem; font-weight: 600; letter-spacing: 1px;
    }
    a:hover { background: #333; }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>찾으시는 페이지가 없어요.</p>
  <a id="home" href="/">GOOD GOODS 홈으로</a>

  <script>
    // GitHub Pages 프로젝트 주소(아이디.github.io/저장소명/)에서는 첫 경로 조각이 저장소 이름이에요.
    (function () {
      var base = '/';
      if (location.hostname.endsWith('github.io')) {
        var first = location.pathname.split('/')[1];
        if (first) base = '/' + first + '/';
      }
      document.getElementById('home').href = base;
    })();
  </script>
</body>
</html>
